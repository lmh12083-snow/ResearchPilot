server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads can be large
    client_max_body_size 50m;

    # SPA fallback — all client routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST + SSE proxy to the backend container.
    # proxy_buffering off is REQUIRED for SSE streaming (chat / compare / review):
    # buffered responses would delay each token until the stream ends.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
